{% extends "base.html" %}
{% load static %}
{% block title %}
    Информация о {{ post.date|lower }}
{% endblock %}
{% block content %}
  <ul>
    <li>Место: {{ post.location }}</li>
    <li>Дата: {{ post.date }}</li>
    <li>
      Категория: 
      <a class="mt-3 regular-link" href="{% url 'blog:category_posts' post.category %}">
        {{ post.category }}
      </a> 
    </li>
  </ul>         

  <p class="card-text">
    {{ post.text }}
  </p>
{% endblock %}
